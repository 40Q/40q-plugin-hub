name: Build Release

on:
  push:
    tags:
      - "release-*"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLUGIN_SLUG: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Build plugin zip
        run: |
          mkdir -p temp
          # Include only the files WordPress needs (adjust to your structure)
          rsync -av --exclude='.git' \
                    --exclude='.github' \
                    --exclude='.gitignore' \
                    --exclude='node_modules' \
                    --exclude='temp' \
                    --exclude='.env*' \
                    --exclude='composer.json' \
                    --exclude='composer.lock' \
                    --exclude='package.json' \
                    --exclude='package-lock.json' \
                    --exclude='yarn.lock' \
                    --exclude='webpack.*' \
                    --exclude='tsconfig.json' \
                    --exclude='src' \
                    ./ temp/${{ env.PLUGIN_SLUG }}/
          cd temp && zip -r ${{ env.PLUGIN_SLUG }}.zip ${{ env.PLUGIN_SLUG }}/

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: temp/${{ env.PLUGIN_SLUG }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
